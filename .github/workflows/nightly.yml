name: Nightly Security & Audit Verification

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  audit-and-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SHA-256 Audit Chain Integrity
        if: env.STAGING_API_URL != '' && env.ADMIN_SERVICE_TOKEN != ''
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
        run: |
          curl -fsSL "$STAGING_API_URL/v1/admin/audit-integrity" \
            -H "Authorization: Bearer $ADMIN_SERVICE_TOKEN" \
            -H "X-Client: ci/1.0.0" | grep -q '"status":"ok"'
      - name: OWASP ZAP Baseline (Staging Web)
        if: env.STAGING_WEB_URL != ''
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_WEB_URL }}
          fail_action: false
