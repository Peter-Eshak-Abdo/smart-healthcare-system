name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm --filter backend-api build
      - run: pnpm --filter web-admin build
      - name: Push Supabase Migrations (Staging)
        if: env.SUPABASE_DB_URL != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Validate Production Compose Syntax
        run: docker compose -f infra/docker-compose.prod.yml config -q
