name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run build -w @smarthealth/contracts
      - run: npm run build -w backend-api
      - run: npm run build -w web-admin
      - name: Deploy Firestore Rules & Indexes (Staging)
        if: env.FIREBASE_SERVICE_ACCOUNT_STAGING != '' && env.FIREBASE_PROJECT_ID_STAGING != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json npx --yes firebase-tools deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID"
          rm -f /tmp/firebase-sa.json
      - name: Trigger Render Staging Deploy
        if: env.RENDER_DEPLOY_HOOK_STAGING != ''
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_STAGING"
