name: smarthealth_mobile
description: "SmartHealth Multi-Platform Application (Patient, Paramedic, Pharmacist)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  camera: ^0.11.1
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  cryptography: ^2.7.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  flutter_image_compress: ^2.4.0
  intl: any
  wakelock_plus: ^1.2.11
  screen_brightness: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
