                additionalProperties: false
  /v1/config/mobile:
    get:
      summary: Mobile client minimum versions and feature flags
      tags:
        - System
      responses:
        '200':
          description: Mobile config
          content:
            application/json:
              schema:
                type: object
                properties:
                  min_version:
                    type: object
                    properties:
                      android:
                        type: string
                      ios:
                        type: string
                    required:
                      - android
                      - ios
                    additionalProperties: false
                  emergency_phone:
                    type: string
                  feature_flags:
                    type: object
                    additionalProperties:
                      type: boolean
                required:
                  - min_version
                  - emergency_phone
                  - feature_flags
                additionalProperties: false
  /v1/auth/devices:
    post:
      summary: Register device P-256 public key for biometric step-up
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  format: uuid
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                    - web
                model:
                  type: string
                  minLength: 1
                  maxLength: 120
                public_key_spki_b64:
                  type: string
                  minLength: 32
                  maxLength: 2048
                key_algorithm:
                  type: string
                  enum:
                    - ES256
                biometric_bound:
                  type: boolean
              required:
                - device_id
                - platform
                - model
                - public_key_spki_b64
                - key_algorithm
                - biometric_bound
              additionalProperties: false
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                    format: uuid
                  registered_at:
                    type: string
                    format: date-time
                required:
