  /v1/.well-known/rx-jwks.json:
    get:
      summary: Ed25519 JWKS for verifying prescriptions and pickup tokens
      tags:
        - System
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          enum:
                            - OKP
                        crv:
                          type: string
                          enum:
                            - Ed25519
                        kid:
                          type: string
                        x:
                          type: string
                        use:
                          type: string
                          enum:
                            - sig
                        alg:
                          type: string
                          enum:
                            - EdDSA
                      required:
                        - kty
                        - crv
                        - kid
                        - x
                        - use
                        - alg
                      additionalProperties: false
                required:
                  - keys
                additionalProperties: false
  /v1/.well-known/emergency-card-jwks.json:
    get:
      summary: Ed25519 JWKS for verifying offline emergency medical ID cards
      tags:
        - System
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
