                              - A+
                              - A-
                              - B+
                              - B-
                              - AB+
                              - AB-
                              - O+
                              - O-
                              - unknown
                          source:
                            type: string
                            enum:
                              - patient_reported
                              - clinician_confirmed
                              - imported
