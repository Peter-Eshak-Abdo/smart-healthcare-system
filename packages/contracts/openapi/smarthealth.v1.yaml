openapi: 3.1.0
info:
  title: SmartHealth API
  version: 1.0.0
  description: SmartHealth Digital Healthcare Platform API v1
servers:
  - url: http://localhost:4000
    description: Local dev
  - url: https://api-staging.smarthealth.app
    description: Staging
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorCode:
      type: string
      enum:
        - AUTH_TOKEN_MISSING
        - AUTH_TOKEN_INVALID
        - AUTH_TOKEN_EXPIRED
        - AUTH_SESSION_REVOKED
        - AUTH_MFA_REQUIRED
        - AUTH_STEP_UP_REQUIRED
        - AUTH_STEP_UP_INVALID
        - ACCOUNT_SUSPENDED
        - LICENSE_NOT_VALID
        - RBAC_FORBIDDEN
        - ACCESS_GRANT_REQUIRED
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_CONFLICT
        - CONFLICT_VERSION
        - RATE_LIMITED
        - RX_NOT_FOUND
        - RX_SIGNATURE_INVALID
        - RX_EXPIRED
        - RX_CANCELLED
        - RX_ALREADY_DISPENSED
        - RX_QUANTITY_EXCEEDED
        - RX_LEASE_HELD
        - RX_ALERT_OVERRIDE_REQUIRED
        - RX_PRESCRIBER_INVALID
        - PICKUP_TOKEN_INVALID
        - EMERG_NO_MATCH
        - EMERG_SESSION_EXPIRED
        - EMERG_CONTACTS_NOT_SHARED
        - BIO_NO_FACE
        - BIO_MULTIPLE_FACES
        - BIO_LOW_QUALITY
        - BIO_LIVENESS_FAILED
        - BIO_CONSENT_REQUIRED
        - BIO_ALREADY_ENROLLED
        - AI_SERVICE_UNAVAILABLE
        - AI_TIMEOUT
        - FEATURE_NOT_IMPLEMENTED
        - INTERNAL_ERROR
    FieldError:
      type: object
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
        alert_key:
          type: string
      required:
        - path
        - code
        - message
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        code:
          type: string
          enum:
            - AUTH_TOKEN_MISSING
            - AUTH_TOKEN_INVALID
            - AUTH_TOKEN_EXPIRED
            - AUTH_SESSION_REVOKED
            - AUTH_MFA_REQUIRED
            - AUTH_STEP_UP_REQUIRED
            - AUTH_STEP_UP_INVALID
            - ACCOUNT_SUSPENDED
            - LICENSE_NOT_VALID
            - RBAC_FORBIDDEN
            - ACCESS_GRANT_REQUIRED
            - RESOURCE_NOT_FOUND
            - VALIDATION_FAILED
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_CONFLICT
            - CONFLICT_VERSION
            - RATE_LIMITED
            - RX_NOT_FOUND
            - RX_SIGNATURE_INVALID
            - RX_EXPIRED
            - RX_CANCELLED
            - RX_ALREADY_DISPENSED
            - RX_QUANTITY_EXCEEDED
            - RX_LEASE_HELD
            - RX_ALERT_OVERRIDE_REQUIRED
            - RX_PRESCRIBER_INVALID
            - PICKUP_TOKEN_INVALID
            - EMERG_NO_MATCH
            - EMERG_SESSION_EXPIRED
            - EMERG_CONTACTS_NOT_SHARED
            - BIO_NO_FACE
            - BIO_MULTIPLE_FACES
            - BIO_LOW_QUALITY
            - BIO_LIVENESS_FAILED
            - BIO_CONSENT_REQUIRED
            - BIO_ALREADY_ENROLLED
            - AI_SERVICE_UNAVAILABLE
            - AI_TIMEOUT
            - FEATURE_NOT_IMPLEMENTED
            - INTERNAL_ERROR
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
              alert_key:
                type: string
            required:
              - path
              - code
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - instance
        - request_id
      additionalProperties: false
    LocalizedText:
      type: object
      properties:
        en:
          type: string
        ar:
          type: string
      required:
        - en
        - ar
      additionalProperties: false
    AppRole:
      type: string
      enum:
        - patient
        - doctor
        - pharmacist
        - paramedic
        - admin
    Sex:
      type: string
      enum:
        - male
        - female
    BloodType:
      type: string
      enum:
        - A+
        - A-
        - B+
        - B-
        - AB+
        - AB-
        - O+
        - O-
        - unknown
    PageMeta:
      type: object
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
      required:
        - next_cursor
        - has_more
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        commit:
          type: string
      required:
        - status
        - version
        - commit
      additionalProperties: false
  parameters: {}
paths:
  /v1/health:
    get:
      summary: Service liveness check
      tags:
        - System
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  version:
                    type: string
                  commit:
                    type: string
                required:
                  - status
                  - version
                  - commit
                additionalProperties: false
        '500':
          description: RFC 9457 Problem Details error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    format: uri
                  title:
                    type: string
                  status:
                    type: integer
