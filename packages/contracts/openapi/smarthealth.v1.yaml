  /v1/assistant/sessions/{sessionId}:
    get:
      summary: Read assistant session transcript
      tags:
        - Assistant
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '200':
          description: Session transcript
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  locale:
                    type: string
                    enum:
                      - ar
                      - en
                  status:
                    type: string
                    enum:
                      - open
                      - closed
                  created_at:
                    type: string
                    format: date-time
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                        text:
                          type: string
                        triage_level:
                          type:
                            - string
                            - 'null'
                          enum:
                            - emergency
                            - urgent
                            - soon
                            - routine
                            - self_care
                        red_flag:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                      required:
                        - id
                        - role
                        - text
                        - triage_level
                        - red_flag
                        - created_at
                      additionalProperties: false
                required:
                  - session_id
                  - locale
                  - status
                  - created_at
                  - messages
                additionalProperties: false
    delete:
      summary: Hard-delete assistant session and messages
      tags:
        - Assistant
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: sessionId
          in: path
      responses:
        '204':
          description: Deleted
