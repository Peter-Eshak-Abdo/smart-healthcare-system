services:
  caddy:
    image: caddy:2.9-alpine
    container_name: smarthealth-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend-api:
        condition: service_healthy
      web-admin:
        condition: service_started
    networks:
      - smarthealth_edge

  redis:
    image: redis:7.4-alpine
    container_name: smarthealth-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - smarthealth_private

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: smarthealth-ai
    restart: unless-stopped
    env_file:
      - ../ai-service/.env
    # Strictly unreachable from public internet / smarthealth_edge
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - smarthealth_private

  backend-api:
    build:
      context: ..
      dockerfile: backend-api/Dockerfile
    container_name: smarthealth-backend
    restart: unless-stopped
    env_file:
      - ../backend-api/.env
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - smarthealth_edge
      - smarthealth_private

  web-admin:
    build:
      context: ..
      dockerfile: web-admin/Dockerfile
    container_name: smarthealth-web
    restart: unless-stopped
    env_file:
      - ../web-admin/.env
    expose:
      - "3000"
    depends_on:
      backend-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - smarthealth_edge

volumes:
  caddy_data:
  caddy_config:
  redis_data:

networks:
  smarthealth_edge:
    driver: bridge
  smarthealth_private:
    driver: bridge
    internal: true
