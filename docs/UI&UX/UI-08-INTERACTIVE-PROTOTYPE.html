<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سمارت هيلث — نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm clinical, warm Egyptian; IDEA: a design-review bench holding two real devices;
   PICTURE: the device itself (laptop or iPhone) is the hero; COLOUR/TYPE: UI-01 tokens, Cairo + IBM Plex Sans Arabic + Inter;
   LAYOUT: controls column at inline-start, device stage fills the rest, stacks under 900px. */
:root{color-scheme:light dark;--page:light-dark(#E9EDF3,#0A0F1A);--pageInk:light-dark(#111827,#E5E7EB);--pagePanel:light-dark(#FFFFFF,#111827);--pageLine:light-dark(#D6DCE5,#243044)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--pageInk);font:15px/1.6 "IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,bdi.num{white-space:nowrap;font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1,"lnum" 1}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.02em}
:focus-visible{outline:2px solid var(--ring,#2563EB);outline-offset:2px}

/* ---------- studio layout ---------- */
.studio{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.panel{background:var(--pagePanel);border-inline-end:1px solid var(--pageLine);padding:18px 16px 40px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.panel h1{font-family:Cairo,sans-serif;font-size:22px;line-height:1.2;margin:0 0 2px}
.panel .sub{font-size:13px;opacity:.75;margin:0 0 14px}
.grp{margin:14px 0}
.grp>label,.grp>.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--pageLine);background:transparent;border-radius:10px;padding:7px 11px;min-height:38px;font-size:13.5px}
.seg button[aria-pressed=true]{background:#2563EB;border-color:#2563EB;color:#fff;font-weight:600}
.edges{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edges button{border:1px solid var(--pageLine);background:transparent;border-radius:10px;padding:8px 9px;text-align:start;font-size:13px;min-height:44px;line-height:1.3}
.edges button:hover{border-color:#DC2626}
.edges button .t{display:block;font-size:11px;opacity:.7}
.specref{margin-top:14px;font-size:12.5px;border:1px dashed var(--pageLine);border-radius:10px;padding:8px 10px}
.stage{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;overflow:hidden}
.fit{transform-origin:center center}
@media(max-width:900px){.studio{display:flex;flex-direction:column}.stage{order:1;min-height:auto;padding:12px}.panel{order:2;position:static;max-height:none;border-inline-end:0;border-top:1px solid var(--pageLine)}}

/* ---------- device frames ---------- */
.phone{width:426px;height:898px;border-radius:66px;background:#0b0b0d;padding:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55),inset 0 0 0 2px #2a2a2e;position:relative}
.phone .scr{width:402px;height:874px;border-radius:54px;overflow:hidden;position:relative}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:60}
.sbar{position:absolute;top:0;inset-inline:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 16px Inter,sans-serif;z-index:55;pointer-events:none;color:var(--fg)}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:55}
.laptop{display:flex;flex-direction:column;align-items:center}
.laptop .lid{background:#0f1115;border-radius:18px 18px 6px 6px;padding:14px 14px 16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5),inset 0 0 0 2px #2a2d33}
.laptop .scr{width:1280px;height:800px;border-radius:6px;overflow:hidden;position:relative}
.laptop .base{width:1420px;height:18px;background:linear-gradient(#c9ced6,#9aa1ab);border-radius:0 0 18px 18px;position:relative}
.laptop .base:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:180px;height:7px;background:#7c838d;border-radius:0 0 8px 8px}

/* ---------- product tokens (UI-01 §3) ---------- */
.scr,[data-theme=light]{--bg:#F3F4F6;--fg:#111827;--card:#FFFFFF;--raised:#FFFFFF;--sunk:#F9FAFB;--muted:#F3F4F6;--mfg:#4B5563;--ph:#6B7280;--border:#E5E7EB;--input:#7B8494;--ring:#2563EB;
 --primary:#2563EB;--onp:#FFFFFF;--phov:#1D4ED8;--psub:#EFF6FF;--ponsub:#1D4ED8;--accent:#F0FDFA;--accon:#0F766E;
 --danger:#DC2626;--dsurf:#FEF2F2;--don:#991B1B;--warn:#B45309;--wsurf:#FFFBEB;--won:#92400E;--caut:#A16207;--csurf:#FEFCE8;--con:#854D0E;
 --ok:#15803D;--oksurf:#F0FDF4;--okon:#166534;--info:#0369A1;--isurf:#F0F9FF;--ion:#075985;--off:#B45309;--offsurf:#FFFBEB;--offon:#92400E;
 --ai:#6D28D9;--aisurf:#F5F3FF;--aion:#5B21B6;--glass:rgba(255,255,255,.62);--glassb:rgba(255,255,255,.55);--blur:20px;
 --e1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--e2:0 4px 8px -2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.06);
 --e3:0 12px 16px -4px rgba(16,24,40,.10),0 4px 6px -2px rgba(16,24,40,.05);--e4:0 20px 24px -4px rgba(16,24,40,.10),0 8px 8px -4px rgba(16,24,40,.04);
 --e5:0 24px 48px -12px rgba(16,24,40,.25),0 30px 60px -20px rgba(37,99,235,.35);--scrim:rgba(17,24,39,.48);--g1:rgba(37,99,235,.10);--g2:rgba(13,148,136,.08)}
[data-theme=dark]{--bg:#0B1220;--fg:#F9FAFB;--card:#111827;--raised:#1A2333;--sunk:#0F172A;--muted:#1F2937;--mfg:#9CA3AF;--ph:#9CA3AF;--border:#243044;--input:#6B7280;--ring:#93C5FD;
 --primary:#60A5FA;--onp:#0B1220;--phov:#93C5FD;--psub:#172554;--ponsub:#BFDBFE;--accent:#042F2E;--accon:#2DD4BF;
 --danger:#F87171;--dsurf:#450A0A;--don:#FECACA;--warn:#FBBF24;--wsurf:#451A03;--won:#FDE68A;--caut:#FACC15;--csurf:#422006;--con:#FEF08A;
 --ok:#4ADE80;--oksurf:#052E16;--okon:#BBF7D0;--info:#38BDF8;--isurf:#082F49;--ion:#BAE6FD;--off:#FBBF24;--offsurf:#451A03;--offon:#FDE68A;
 --ai:#A78BFA;--aisurf:#2E1065;--aion:#DDD6FE;--glass:rgba(17,24,39,.55);--glassb:rgba(255,255,255,.08);--blur:24px;
 --e1:0 0 0 1px #243044;--e2:0 0 0 1px #243044,0 6px 14px rgba(0,0,0,.4);--e3:0 12px 24px rgba(0,0,0,.45);--e4:0 24px 48px rgba(0,0,0,.55);--e5:0 30px 60px -20px rgba(96,165,250,.25);--scrim:rgba(0,0,0,.64);--g1:rgba(96,165,250,.10);--g2:rgba(45,212,191,.08)}
[data-theme=emergency]{--bg:#000;--fg:#FFF;--card:#1C1C1E;--raised:#1C1C1E;--sunk:#000;--muted:#1C1C1E;--mfg:#FFF;--ph:#FFF;--border:#3A3A3C;--input:#FFF;--ring:#FFD60A;
 --primary:#FFF;--onp:#000;--phov:#E5E5E5;--psub:#1C1C1E;--ponsub:#FFF;--danger:#FF3B30;--dsurf:#7F1D1D;--don:#FFF;--warn:#FFD60A;--wsurf:#FFD60A;--won:#000;
 --ok:#30D158;--oksurf:#30D158;--okon:#000;--info:#0A84FF;--off:#FF9F0A;--offsurf:#FF9F0A;--offon:#000;--glass:#1C1C1E;--glassb:#3A3A3C;--blur:0px;
 --e1:none;--e2:none;--e3:none;--e4:none;--e5:none;--scrim:rgba(0,0,0,.85);--g1:transparent;--g2:transparent}
[data-theme=sunlight]{--bg:#FFF;--fg:#000;--card:#FFF;--raised:#FFF;--sunk:#F3F4F6;--muted:#F3F4F6;--mfg:#1F2937;--ph:#374151;--border:#000;--input:#000;--ring:#0040C1;
 --primary:#0040C1;--onp:#FFF;--phov:#002E8A;--psub:#E6EEFF;--ponsub:#0040C1;--danger:#B00020;--dsurf:#FFF;--don:#B00020;--warn:#000;--wsurf:#FFD60A;--won:#000;
 --caut:#000;--csurf:#FFF7B3;--con:#000;--ok:#006B2D;--oksurf:#FFF;--okon:#006B2D;--info:#0040C1;--isurf:#FFF;--ion:#0040C1;--off:#000;--offsurf:#FFD60A;--offon:#000;
 --glass:#FFF;--glassb:#000;--blur:0px;--e1:0 0 0 2px #000;--e2:0 0 0 2px #000;--e3:0 0 0 2px #000;--e4:0 0 0 2px #000;--e5:none;--g1:transparent;--g2:transparent}
.scr{transform:translateZ(0)}
.scr,.themed{background:var(--bg);color:var(--fg);font-size:calc(16px * var(--fs,1))}
.canvasglow{background:radial-gradient(600px 400px at 85% 0%,var(--g1),transparent 70%),radial-gradient(500px 400px at 0% 100%,var(--g2),transparent 70%),var(--bg)}
[data-low="1"] .glass{backdrop-filter:none!important;background:var(--card)!important}

/* ---------- product type & components ---------- */
.h1{font-family:Cairo,sans-serif;font-weight:700;font-size:1.75em;line-height:1.35;margin:0}
.h2{font-family:Cairo,sans-serif;font-weight:700;font-size:1.375em;line-height:1.4;margin:0}
.h3{font-family:Cairo,sans-serif;font-weight:600;font-size:1.125em;line-height:1.45;margin:0}
.bodylg{font-size:1.0625em;line-height:1.65}.sm{font-size:.875em}.cap{font-size:.75em;font-weight:500}.mut{color:var(--mfg)}
.disp{font-family:Inter,sans-serif;font-weight:800;font-size:2.25em;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid transparent;padding:0 18px;min-height:44px;font-weight:600;font-size:.9375em;transition:background .15s,transform .1s;background:transparent;color:var(--fg)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);color:var(--onp)}.btn.pri:hover{background:var(--phov)}
.btn.sec{background:var(--card);border-color:var(--input)}
.btn.gho{color:var(--primary)}.btn.gho:hover{background:var(--psub)}
.btn.dan{background:var(--danger);color:#fff}
[data-theme=emergency] .btn.dan{color:#000}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn.full{width:100%}
.btn.big{min-height:56px;font-size:1.05em}
.why{font-size:.8125em;color:var(--warn);margin-top:6px;font-weight:600;display:flex;gap:6px;align-items:center}
.card{background:var(--card);border-radius:16px;box-shadow:var(--e1);border:1px solid var(--border);padding:16px}
[data-theme=dark] .card{border-color:transparent}
.tile{background:var(--card);border-radius:20px;box-shadow:var(--e1);border:1px solid var(--border);padding:14px;transition:transform .15s,box-shadow .15s;text-align:start;display:flex;flex-direction:column;gap:6px}
button.tile:hover{transform:translateY(-2px);box-shadow:var(--e2)}button.tile:active{transform:scale(.98)}
.ib{width:36px;height:36px;border-radius:12px;background:var(--psub);color:var(--ponsub);display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.8125em;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.chip.ana{background:var(--danger);border-color:var(--danger);color:#fff}
[data-theme=emergency] .chip.ana{color:#000}
.chip.self{color:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 9px;font-size:.8125em;font-weight:600;transition:background-color .25s,color .25s}
.b-pending{background:#DBEAFE;color:#1D4ED8}.b-partial{background:#FEF3C7;color:#92400E}.b-done{background:#DCFCE7;color:#166534}.b-cancel{background:#E5E7EB;color:#374151}.b-exp{background:#F3F4F6;color:#374151}
[data-theme=dark] .b-pending{background:#1E3A8A;color:#BFDBFE}[data-theme=dark] .b-partial{background:#78350F;color:#FDE68A}[data-theme=dark] .b-done{background:#14532D;color:#BBF7D0}[data-theme=dark] .b-cancel{background:#374151;color:#E5E7EB}
.badge .lab{animation:lab .25s ease}@keyframes lab{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sev{border-radius:8px;padding:12px 14px;border-inline-start:3px solid var(--c);background:var(--s);color:var(--o);display:flex;gap:10px}
.sev.ci{--c:var(--danger);--s:var(--dsurf);--o:var(--don)}.sev.mj{--c:var(--warn);--s:var(--wsurf);--o:var(--won)}.sev.md{--c:var(--caut);--s:var(--csurf);--o:var(--con)}.sev.mn{--c:var(--info);--s:var(--isurf);--o:var(--ion)}.sev.okb{--c:var(--ok);--s:var(--oksurf);--o:var(--okon)}.sev.aib{--c:var(--ai);--s:var(--aisurf);--o:var(--aion)}
.sev.pulse{animation:pulse .6s ease 1}@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 4px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.sev .ttl{font-weight:700;font-family:Cairo,sans-serif}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:.875em}
.inp{height:44px;border-radius:10px;border:1.5px solid var(--input);background:var(--card);padding:0 12px;color:var(--fg);font-size:16px}
textarea.inp{height:80px;padding:10px 12px;resize:vertical}
.inp:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 30%,transparent)}
.glass{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border:1px solid var(--glassb)}
.ribbon{background:var(--offsurf);color:var(--offon);font-weight:700;font-size:.875em;padding:6px 14px;display:flex;gap:8px;align-items:center;justify-content:center;animation:down .2s ease}
@keyframes down{from{transform:translateY(-100%)}to{transform:none}}
.toastwrap{position:absolute;inset-inline:0;bottom:110px;display:flex;justify-content:center;z-index:70;pointer-events:none}
.toast{background:#111827;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:var(--e3);animation:rise .15s ease;pointer-events:auto}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.scrim.center{align-items:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;border-radius:28px 28px 0 0;padding:10px 18px 40px;max-height:92%;overflow:auto;animation:sheet .32s cubic-bezier(.05,.7,.1,1)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 12px}
.dlg{background:var(--card);border-radius:16px;box-shadow:var(--e4);width:min(560px,92%);padding:20px;animation:dlg .25s cubic-bezier(.05,.7,.1,1)}
@keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.sp{flex:1}.wrap{flex-wrap:wrap}
.scroll{overflow-y:auto}
.hide{display:none!important}
.divider{height:1px;background:var(--border);margin:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:.875em}
.tbl th{background:var(--sunk);text-align:start;font-weight:600;padding:9px 10px;position:sticky;top:0}
.tbl td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle}
.tbl td.n{text-align:end}
.flash{animation:flash 1.2s ease 1}@keyframes flash{0%,30%{background:var(--wsurf)}100%{background:transparent}}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--input);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:36px;border:0;background:var(--muted);font-weight:700}
.stepper span{min-width:40px;text-align:center}
.seal-stamp{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) 1}@keyframes stamp{0%{transform:scale(1.25);opacity:0}100%{transform:scale(1);opacity:1}}
.ring-rot{transform-origin:50% 50%;animation:rot 24s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.spin{animation:rot 1.2s linear infinite;transform-origin:50% 50%}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--border) 50%,var(--muted) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:8px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
[dir=rtl] .shimmer{animation-direction:reverse}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ai);margin:0 2px;animation:dot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
.rm *,.rm *:before,.rm *:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}}
[data-theme=emergency] *{transition:none!important;animation:none!important}
[data-theme=emergency] .allow-anim,[data-theme=emergency] .allow-anim *{animation:revert!important}
.em-h{font-family:Cairo,sans-serif;font-weight:800;font-size:1.75em;line-height:1.3}
.em-b{font-size:1.25em;font-weight:600;line-height:1.5}
.em-l{font-size:1.125em;font-weight:700}
.em-d{font-family:Inter,sans-serif;font-weight:800;font-size:2.5em;line-height:1.1}
.em-btn{min-height:64px;border-radius:16px;font-family:Cairo,sans-serif;font-weight:800;font-size:1.25em;border:0;width:100%}
.prog{height:8px;border-radius:4px;background:#2b2b2e;overflow:hidden}.prog>i{display:block;height:100%;background:#30D158;transition:width .2s linear!important}
.kbd{font:600 11px Inter,sans-serif;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--mfg)}
.navitem{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;font-weight:500;color:var(--fg);border:0;background:transparent;width:100%;text-align:start;position:relative}
.navitem[aria-current=page]{background:var(--psub);color:var(--ponsub);font-weight:700}
.navitem[aria-current=page]:before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary)}
.tabbar{position:absolute;bottom:0;inset-inline:0;height:86px;display:flex;padding:6px 8px 30px;z-index:40}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mfg)}
.tabbar button[aria-current=page]{color:var(--primary)}
.idcard{aspect-ratio:1.586;width:100%;position:relative;transform-style:preserve-3d;border-radius:20px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.idface{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.idfront{background:linear-gradient(135deg,#2563EB,#0D9488);color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
[data-theme=dark] .idfront{background:linear-gradient(135deg,#1D4ED8,#0F766E)}
.idback{transform:rotateY(180deg);background:#fff;color:#000;display:flex;align-items:center;gap:14px;padding:14px}
.guil{position:absolute;inset:0;opacity:.09;background:repeating-radial-gradient(circle at 70% 120%,#fff 0 1px,transparent 1px 7px)}
.foil{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.35;background:conic-gradient(from var(--fa,0deg) at var(--fx,50%) var(--fy,50%),#ff9ad5,#9ae6ff,#b4ff9a,#fff59a,#ff9ad5)}
.sheen{position:absolute;inset:0;background:radial-gradient(260px 200px at var(--sx,50%) var(--sy,30%),rgba(255,255,255,.28),transparent 60%)}
.idcard .lift{transform:translateZ(16px)}
.morph{transition:all .25s cubic-bezier(.2,0,0,1)}

<body>

/* ---------------- AI orb (raw WebGL fragment shader, UI-02 §6.4) ---------------- */
const ORB={idle:{a:[.486,.227,.929],b:[.145,.388,.922],amp:.08,f:1.2,sp:.25,l:'أنا هنا لو محتاجني'},listening:{a:[.055,.647,.914],b:[.078,.722,.651],amp:.14,f:1.6,sp:.6,l:'سامعك…'},thinking:{a:[.545,.361,.965],b:[.388,.4,.945],amp:.18,f:2.4,sp:1,l:'بفكّر…'},guidance:{a:[.078,.722,.651],b:[.133,.773,.369],amp:.10,f:1,sp:.35,l:'دي إرشادات عامة'},urgent:{a:[.961,.62,.043],b:[.918,.345,.047],amp:.16,f:1.8,sp:.8,l:'محتاج تشوف دكتور خلال ٢٤ ساعة'},emergency:{a:[.937,.267,.267],b:[.725,.11,.11],amp:.22,f:2,sp:1.2,l:'طوارئ'},unavailable:{a:[.61,.64,.69],b:[.61,.64,.69],amp:0,f:1,sp:0,l:'المساعد مش متاح دلوقتي'}};
const FS=`precision mediump float;uniform vec2 R;uniform float T,A,F;uniform vec3 CA,CB;
float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}

if(r>e+.02){gl_FragColor=vec4(0.);return;}float q=clamp(r/e,0.,1.);float z=sqrt(1.-q*q);vec3 N=normalize(vec3(uv/e,z));float m=n(N*F*1.5+vec3(T*.7));
vec3 L=normalize(vec3(-.4,.6,.8));vec3 c=mix(CA,CB,clamp(.5+uv.y*.5+(m-.5)*.6,0.,1.));c*=.55+.45*max(dot(N,L),0.);
c+=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.),24.)*.6+pow(1.-z,2.5)*.45;float al=smoothstep(e+.02,e-.01,r);gl_FragColor=vec4(c*al,al);}`;
function Orb({state='idle',size=120}){const ref=useRef();const st=useRef(state);st.current=state;const {reduced,tier}=useApp();const [fb,setFb]=useState(false);
 useEffect(()=>{if(tier!=='A'&&tier!=='B'){setFb(true);return}const c=ref.current;const gl=c&&c.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:true});if(!gl){setFb(true);return}
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){setFb(true);return}gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=k=>gl.getUniformLocation(pr,k);const dpr=Math.min(window.devicePixelRatio||1,tier==='A'?1.75:1.25);c.width=size*dpr;c.height=size*dpr;gl.viewport(0,0,c.width,c.height);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  let cur={...ORB.idle,a:[...ORB.idle.a],b:[...ORB.idle.b]},t=0,last=performance.now(),raf,frame=0;
  const draw=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const tg=ORB[st.current]||ORB.idle;const k=1-Math.exp(-dt*6);['amp','f','sp'].forEach(x=>cur[x]+=(tg[x]-cur[x])*k);for(let i=0;i<3;i++){cur.a[i]+=(tg.a[i]-cur.a[i])*k;cur.b[i]+=(tg.b[i]-cur.b[i])*k}
   t+=dt*(reduced?0:cur.sp);frame++;if(tier==='B'&&frame%2){raf=requestAnimationFrame(draw);return}
   gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform2f(U('R'),c.width,c.height);gl.uniform1f(U('T'),t);gl.uniform1f(U('A'),reduced?cur.amp*.3:cur.amp);gl.uniform1f(U('F'),cur.f);gl.uniform3fv(U('CA'),cur.a);gl.uniform3fv(U('CB'),cur.b);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
   raf=requestAnimationFrame(draw)};raf=requestAnimationFrame(draw);return()=>{cancelAnimationFrame(raf);const ex=gl.getExtension('WEBGL_lose_context');ex&&ex.loseContext()}},[tier,reduced,size]);

 return html`<canvas ref=${ref} aria-hidden="true" style=${{width:size+'px',height:size+'px',filter:`drop-shadow(0 12px 30px rgba(${(ORB[state]||ORB.idle).a.map(x=>Math.round(x*255)).join(',')},.45))`}}/>`}

const SCAN_COL={searching:'rgba(255,255,255,.7)',aligning:'#FBBF24',aligned:'#2DD4BF',challenge:'#60A5FA',capturing:'#22C55E',uploading:'#22C55E',success:'#22C55E',failed:'#F59E0B',locked:'#EF4444'};
function FaceMesh({phase,pose,sweep,w=378,h=520}){const ref=useRef();const {tier,reduced}=useApp();
 useEffect(()=>{const c=ref.current,x=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cx=w/2,cy=h*.42,RX=w*.31,RY=RX*1.3;
  // simulated camera feed
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1f2a37');g.addColorStop(1,'#0b0f16');x.fillStyle=g;x.fillRect(0,0,w,h);
  const hg=x.createRadialGradient(cx,cy-10,10,cx,cy,RY*1.1);hg.addColorStop(0,'#7a6a5c');hg.addColorStop(.7,'#4a3f37');hg.addColorStop(1,'rgba(30,25,22,0)');x.fillStyle=hg;x.beginPath();x.ellipse(cx+pose.yaw*RX*.25,cy,RX*.92,RY*.95,0,0,7);x.fill();
  x.fillStyle='#2a221c';x.beginPath();x.ellipse(cx,cy+RY*1.55,RX*1.6,RY*.8,0,0,7);x.fill();
  // vignette with oval cut-out
  x.save();x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.rect(0,0,w,h);x.moveTo(cx+RX,cy);x.ellipse(cx,cy,RX,RY,0,0,Math.PI*2,true);x.fill('evenodd');x.restore();
  const col=SCAN_COL[phase]||'#fff';
  x.lineWidth=3;x.strokeStyle=col;x.beginPath();x.ellipse(cx,cy,RX,RY,0,0,7);x.stroke();
  if(tier==='C'||tier==='E'||phase==='locked')return;
  const rot=(v)=>{let [a,b,z]=v;const cy_=Math.cos(pose.yaw),sy=Math.sin(pose.yaw),cp=Math.cos(pose.pitch),sp=Math.sin(pose.pitch);let a1=a*cy_+z*sy,z1=-a*sy+z*cy_;let b1=b*cp-z1*sp,z2=b*sp+z1*cp;return [a1,b1,z2]};
  const prj=v=>{const f=3,s=f/(f+v[2]);return [cx+v[0]*s*RX*.95,cy+v[1]*s*RY*.95,v[2]]};
  // depth rings
  [-.3,0,.3].forEach(hh=>{const rr=Math.sqrt(1-hh*hh);let prev=null;for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;const v=rot([rr*Math.cos(a),hh,rr*Math.sin(a)]);const p=prj(v);if(prev){const front=(v[2]+prev[2])/2<0;x.strokeStyle=col;x.globalAlpha=front?1:.28;x.lineWidth=front?2.4:1;x.beginPath();x.moveTo(prev[0],prev[1]);x.lineTo(p[0],p[1]);x.stroke()}prev=p}});x.globalAlpha=1;
  // contour mesh (front hemisphere lat-long grid inside face region)
  const rows=11,cols=13;const pts=[];for(let i=0;i<rows;i++){pts.push([]);const la=-1.05+i*(2.1/(rows-1));for(let j=0;j<cols;j++){const lo=-1.15+j*(2.3/(cols-1));const v=rot([Math.sin(lo)*Math.cos(la)*.86,Math.sin(la)*.92,-Math.cos(lo)*Math.cos(la)*.86]);pts[i].push([...prj(v),v[2]])}}
  if(tier==='A'){x.shadowColor=col;x.shadowBlur=6}
  x.strokeStyle=col;x.lineWidth=.7;for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const p=pts[i][j];if(p[3]>-.05)continue;x.globalAlpha=Math.min(1,-p[3]*1.4)*.75;if(j<cols-1&&pts[i][j+1][3]<-.05){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(pts[i][j+1][0],pts[i][j+1][1]);x.stroke()}if(i<rows-1&&pts[i+1][j][3]<-.05){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(pts[i+1][j][0],pts[i+1][j][1]);x.stroke()}x.fillStyle=col;x.beginPath();x.arc(p[0],p[1],1.6,0,7);x.fill()}
  x.globalAlpha=1;x.shadowBlur=0;
  if(sweep!=null&&!reduced){const yy=cy-RY+sweep*RY*2;const sg=x.createLinearGradient(0,yy-24,0,yy+24);sg.addColorStop(0,'rgba(34,197,94,0)');sg.addColorStop(.5,'rgba(34,197,94,.55)');sg.addColorStop(1,'rgba(34,197,94,0)');x.save();x.beginPath();x.ellipse(cx,cy,RX,RY,0,0,7);x.clip();x.fillStyle=sg;x.fillRect(0,yy-24,w,48);x.restore()}
 },[phase,pose.yaw,pose.pitch,sweep,tier,reduced,w,h]);
 return html`<canvas ref=${ref} style=${{width:w+'px',height:h+'px',display:'block'}} aria-hidden="true"/>`}

function Enrol({onBack}){const app=useApp();const [ph,setPh]=useState('consent');const [pose,setPose]=useState({yaw:0,pitch:0});const [sweep,setSweep]=useState(null);const [hint,setHint]=useState('');const [steps,setSteps]=useState(0);
 useEffect(()=>{if(ph==='consent'||ph==='success')return;let alive=true,raf,t0=performance.now();const seq=[['searching',900,'حط وشك جوه الدايرة'],['aligning',900,'قرّب شوية'],['aligned',700,'تمام كده — متتحركش'],['challenge',1500,'رمّش بعينك مرة'],['challenge2',1700,'لف وشك ناحية الشمال شوية'],['capturing',1300,'ثانية واحدة…'],['uploading',900,'بنتأكد…']];
  let i=0,start=t0;setPh(seq[0][0]);setHint(seq[0][2]);
  const loop=now=>{if(!alive)return;const s=seq[i];const el=now-start;const tt=now/1000;let yaw=Math.sin(tt*1.3)*.12,pitch=Math.sin(tt*.9)*.06;
   if(s[0]==='searching')yaw=Math.sin(tt*2)*.35;if(s[0]==='challenge2')yaw=-Math.min(.5,el/700*.5);setPose({yaw,pitch});setSweep(s[0]==='capturing'||s[0]==='uploading'?((el/1100)%1):null);
   if(el>s[1]){i++;start=now;if(s[0]==='challenge'||s[0]==='challenge2'){setSteps(x=>x+1);navigator.vibrate&&navigator.vibrate(10)}if(i>=seq.length){setPh('success');setHint('تمام! وشك اتسجل بأمان.');app.toast('بصمة وشك اتسجلت ✓');return}setPh(seq[i][0]);setHint(seq[i][2])}
   raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);return()=>{alive=false;cancelAnimationFrame(raf)}},[ph==='consent'||ph==='success'?ph:'run']);
 if(ph==='consent')return html`<div class="col"><button class="btn gho" style=${{alignSelf:'flex-start'}} onClick=${onBack}><${I} n="chev" mirror=${true}/>رجوع</button><h1 class="h1">استخدمي بصمة وشك في الطوارئ</h1><p class="bodylg">لو حصلك حاجة ومقدرتيش تتكلمي، المسعف يقدر يعرفك من وشك ويشوف فصيلة دمك وحساسيتك فوراً.</p>

 return html`<div class="col" style=${{alignItems:'center'}}><div class="row" style=${{width:'100%'}}><button class="btn gho" onClick=${onBack}><${I} n="x"/></button><span class="sp"></span><b>تسجيل بصمة الوش</b></div>

 if(device==='phone'){screen=role==='patient'?html`<${Patient} cmd=${cmd}/>`:role==='paramedic'?html`<${Paramedic} cmd=${cmd}/>`:role==='pharmacist'?html`<${Pharmacist} cmd=${cmd} mobile=${true}/>`:html`<${Notice} title="الحساب ده بيشتغل على الموقع" body="افتح بوابة سمارت هيلث من اللابتوب عشان تكمّل." act=${html`<button class="btn pri" onClick=${()=>setDevice('laptop')}>بدّل لعرض اللابتوب</button>`}/>`}
 else{screen=role==='doctor'?html`<${Doctor} cmd=${cmd}/>`:role==='admin'?html`<${Admin} cmd=${cmd}/>`:role==='pharmacist'?html`<${Pharmacist} cmd=${cmd} mobile=${false}/>`:role==='paramedic'?html`<${ERDesk}/>`:html`<${Notice} title="تطبيق المريض للموبايل" body="ملفك وروشتاتك وكارت الطوارئ في تطبيق الموبايل." act=${html`<button class="btn pri" onClick=${()=>setDevice('phone')}>بدّل لعرض الموبايل</button>`}/>`}
 const scrTheme=force||(role==='paramedic'?(device==='phone'?'emergency':'sunlight'):theme);
 const devInner=html`<div dir="rtl" class=${'scr'+(reduced?' rm':'')} data-theme=${scrTheme} data-low=${lowPower?'1':'0'} style=${{'--fs':fs}}>${device==='phone'?html`<div class="island"></div><div class="sbar"><bdi class="num">9:41</bdi><span class="row" style=${{gap:'5px'}}>${offline?html`<${I} n="wifioff" s=${16}/>`:html`<span>●●●</span>`}<span>${lowPower?'15%':'82%'}</span></span></div>`:null}${screen}<${Toasts}/>${sheet&&sheet.type==='stepup'?html`<${StepUp} onOk=${sheet.onOk} close=${()=>setSheet(null)}/>`:null}${device==='phone'?html`<div class="homeind"></div>`:null}</div>`;
 const seg=(val,set,opts,label)=>html`<div class="grp"><span class="lbl">${label}</span><div class="seg" role="group" aria-label=${label}>${opts.map(([v,l])=>html`<button key=${v} aria-pressed=${val===v} onClick=${()=>set(v)}>${l}</button>`)}</div></div>`;
 return html`<${Ctx.Provider} value=${ctx}><div class="studio"><aside class="panel" aria-label="التحكم في العرض"><h1>سمارت هيلث</h1><p class="sub">نموذج تفاعلي عالي الدقة — UI-08. كل البيانات تجريبية.</p>
  ${seg(device,setDevice,[['laptop','💻 لابتوب'],['phone','📱 iPhone 16 Pro']],'الجهاز')}
  ${seg(role,setRole,ROLES,'الدور')}
  ${seg(theme,setTheme,[['light','فاتح'],['dark','غامق'],['sunlight','تباين عالي']],'المظهر (الطوارئ تلقائي)')}
  ${seg(fs,setFs,[[1,'خط عادي'],[1.15,'كبير'],[1.3,'كبير جداً']],'حجم الخط')}
  <div class="grp"><span class="lbl">الحركة والطاقة والشبكة</span><div class="seg"><button aria-pressed=${rmUser} onClick=${()=>setRm(v=>!v)}>تقليل الحركة</button><button aria-pressed=${lowPower} onClick=${()=>setLowPower(v=>!v)}>توفير البطارية</button><button aria-pressed=${offline} onClick=${()=>setOffline(v=>!v)}>أوفلاين</button></div></div>
  <div class="grp"><span class="lbl">شغّل حالة طرفية (Edge case)</span><div class="edges">${EDGES.map(([k,l,t])=>html`<button key=${k} onClick=${()=>fire(k)}>${l}<span class="t">${t}</span></button>`)}</div></div>
  <div class="specref" aria-live="polite">الشاشة: <b>${screenId||'—'}</b><br/>مستوى العرض: <b class="num">Tier ${tier}</b>${reduced?' · حركة مخففة':''}</div>
  <p class="sub" style=${{marginTop:'12px'}}>الكاميرا مش متاحة داخل العرض، فالمسح بالوش محاكاة. أكواد QR توضيحية ومش بتتقري.</p></aside>
 <main class="stage" ref=${stageRef}><div style=${{width:dims.w*scale+'px',height:dims.h*scale+'px',direction:'ltr',flex:'none'}}><div ref=${devRef} style=${{transform:`scale(${scale})`,transformOrigin:'0 0',width:'max-content'}}>${device==='phone'?html`<div class="phone">${devInner}</div>`:html`<div class="laptop"><div class="lid">${devInner}</div><div class="base"></div></div>`}</div></div></main></div></${Ctx.Provider}>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
}
</script>
